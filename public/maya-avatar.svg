<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bgM" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </radialGradient>
    <radialGradient id="skinM" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fde8d0"/>
      <stop offset="100%" stop-color="#f0b98f"/>
    </radialGradient>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#bgM)"/>

  <circle cx="30" cy="36" r="3" fill="#5eead4" opacity="0.35"/>
  <circle cx="170" cy="26" r="2" fill="#2dd4bf" opacity="0.4"/>
  <circle cx="166" cy="158" r="2.5" fill="#99f6e4" opacity="0.3"/>

  <!-- Sporty tank top -->
  <path d="M 34 200 Q 42 164 72 151 L 90 147 L 100 158 L 110 147 L 128 151 Q 158 164 166 200 Z" fill="#0f766e"/>
  <path d="M 90 147 L 100 168 L 110 147 L 100 158 Z" fill="#115e59"/>
  <!-- Racerback straps -->
  <path d="M 75 150 L 82 200" stroke="#134e4a" stroke-width="4" opacity="0.5"/>
  <path d="M 125 150 L 118 200" stroke="#134e4a" stroke-width="4" opacity="0.5"/>

  <!-- Neck -->
  <rect x="87" y="141" width="26" height="18" rx="9" fill="url(#skinM)"/>

  <!-- Hair (behind head, high ponytail base) -->
  <path d="M 62 100 Q 55 126 60 148 Q 68 158 80 152" fill="#2f1c10"/>
  <path d="M 138 100 Q 145 126 140 148 Q 132 158 120 152" fill="#2f1c10"/>

  <!-- Head -->
  <ellipse cx="100" cy="110" rx="37" ry="40" fill="url(#skinM)"/>

  <!-- Hair top, swept back into ponytail -->
  <path d="M 62 98 Q 60 72 76 60 Q 88 53 100 52 Q 112 53 124 60 Q 140 72 138 98 Q 130 82 100 79 Q 70 82 62 98 Z" fill="#2f1c10"/>
  <!-- Ponytail -->
  <path d="M 100 52 Q 112 44 118 30 Q 122 46 112 58 Q 106 56 100 52 Z" fill="#2f1c10"/>
  <!-- Headband -->
  <path d="M 61 92 Q 100 78 139 92 L 137 100 Q 100 87 63 100 Z" fill="#2dd4bf"/>
  <circle cx="100" cy="86" r="2.4" fill="#f0fdfa" opacity="0.8"/>

  <!-- Ears -->
  <ellipse cx="62" cy="113" rx="7" ry="9" fill="url(#skinM)"/>
  <ellipse cx="138" cy="113" rx="7" ry="9" fill="url(#skinM)"/>
  <circle cx="62" cy="118" r="2.4" fill="#5eead4"/>
  <circle cx="138" cy="118" r="2.4" fill="#5eead4"/>

  <!-- Eyes whites -->
  <ellipse cx="86" cy="111" rx="9.5" ry="10" fill="white"/>
  <ellipse cx="114" cy="111" rx="9.5" ry="10" fill="white"/>
  <!-- Iris -->
  <circle cx="86" cy="112" r="6.3" fill="#134e4a"/>
  <circle cx="114" cy="112" r="6.3" fill="#134e4a"/>
  <!-- Pupil -->
  <circle cx="86" cy="112" r="3.8" fill="#031412"/>
  <circle cx="114" cy="112" r="3.8" fill="#031412"/>
  <!-- Shine -->
  <circle cx="88.5" cy="110" r="2.1" fill="white"/>
  <circle cx="116.5" cy="110" r="2.1" fill="white"/>

  <!-- Eyebrows, energetic arch -->
  <path d="M 77 101 Q 86 96 95 100" stroke="#2f1c10" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M 105 100 Q 114 96 123 101" stroke="#2f1c10" stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M 97 124 Q 100 128 103 124" stroke="#c98d5e" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.55"/>

  <!-- Big energetic smile -->
  <path d="M 86 133 Q 100 148 114 133" stroke="#a35a2c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 90 136 Q 100 142 110 136" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- Rosy active cheeks -->
  <ellipse cx="72" cy="128" rx="10" ry="6.5" fill="#5eead4" opacity="0.35"/>
  <ellipse cx="128" cy="128" rx="10" ry="6.5" fill="#5eead4" opacity="0.35"/>
</svg>
