<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bgJ" cx="50%" cy="28%" r="82%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="55%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </radialGradient>
    <radialGradient id="skinJ" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fde8d0"/>
      <stop offset="100%" stop-color="#eec19a"/>
    </radialGradient>
    <linearGradient id="hairJ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="55%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#bgJ)"/>

  <!-- Phoenix-ish embers -->
  <circle cx="32" cy="42" r="3" fill="#fb923c" opacity="0.45"/>
  <circle cx="168" cy="32" r="2.2" fill="#fdba74" opacity="0.5"/>
  <circle cx="172" cy="150" r="2.6" fill="#fb7185" opacity="0.4"/>
  <circle cx="26" cy="140" r="2" fill="#fed7aa" opacity="0.45"/>

  <!-- Long hair behind the shoulders -->
  <path d="M 56 104 Q 44 140 52 200 L 148 200 Q 156 140 144 104 Q 148 150 124 166 L 76 166 Q 52 150 56 104 Z" fill="url(#hairJ)"/>

  <!-- Top / shoulders -->
  <path d="M 34 200 Q 42 164 74 152 L 92 147 L 100 158 L 108 147 L 126 152 Q 158 164 166 200 Z" fill="#1f2937"/>
  <path d="M 84 150 Q 100 164 116 150 L 112 158 Q 100 169 88 158 Z" fill="#111827"/>

  <!-- Neck -->
  <rect x="88" y="140" width="24" height="18" rx="9" fill="url(#skinJ)"/>

  <!-- Head -->
  <ellipse cx="100" cy="108" rx="36" ry="39" fill="url(#skinJ)"/>

  <!-- Ears -->
  <ellipse cx="64" cy="110" rx="6.5" ry="9" fill="url(#skinJ)"/>
  <ellipse cx="136" cy="110" rx="6.5" ry="9" fill="url(#skinJ)"/>

  <!-- Hair front: side part with a sweeping fringe -->
  <path d="M 64 100 Q 60 72 78 61 Q 92 54 104 55 Q 126 57 136 76 Q 142 90 138 104 Q 133 84 112 78 Q 92 74 78 86 Q 70 92 64 100 Z" fill="url(#hairJ)"/>
  <path d="M 104 56 Q 84 70 70 96 Q 68 78 80 66 Q 92 57 104 56 Z" fill="#991b1b" opacity="0.55"/>
  <path d="M 120 62 Q 134 74 137 96" stroke="#fca5a5" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.45"/>

  <!-- Eyes -->
  <ellipse cx="87" cy="108" rx="8.6" ry="9.2" fill="white"/>
  <ellipse cx="113" cy="108" rx="8.6" ry="9.2" fill="white"/>
  <circle cx="87" cy="109" r="5.8" fill="#14532d"/>
  <circle cx="113" cy="109" r="5.8" fill="#14532d"/>
  <circle cx="87" cy="109" r="3.4" fill="#052012"/>
  <circle cx="113" cy="109" r="3.4" fill="#052012"/>
  <circle cx="89" cy="106.5" r="2" fill="white"/>
  <circle cx="115" cy="106.5" r="2" fill="white"/>

  <!-- Lashes -->
  <path d="M 78 103 Q 87 98 96 103" stroke="#3f1414" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M 104 103 Q 113 98 122 103" stroke="#3f1414" stroke-width="2.4" fill="none" stroke-linecap="round"/>

  <!-- Eyebrows: one slightly raised, because of course it is -->
  <path d="M 77 94 Q 87 89 96 93" stroke="#7f1d1d" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M 104 91 Q 113 86 123 91" stroke="#7f1d1d" stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M 97 120 Q 100 124 103 120" stroke="#c48a5c" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.55"/>

  <!-- Blush -->
  <ellipse cx="75" cy="123" rx="8" ry="5" fill="#fb7185" opacity="0.30"/>
  <ellipse cx="125" cy="123" rx="8" ry="5" fill="#fb7185" opacity="0.30"/>

  <!-- Smirk, not a smile -->
  <path d="M 90 131 Q 100 139 112 130" stroke="#be123c" stroke-width="2.8" fill="none" stroke-linecap="round"/>
</svg>
